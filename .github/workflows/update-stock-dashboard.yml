name: Update TW Stock Dashboard Data

on:
  schedule:
    # 週一至週五 15:00 CST (UTC 07:00)：核心/熱門股盤後收盤價與技術面主更新
    - cron: "0 7 * * 1-5"
    # 週一至週五 16:00 CST (UTC 08:00)：核心/熱門股三大法人與籌碼面補齊更新
    - cron: "0 8 * * 1-5"
    # 每日 21:00 CST (UTC 13:00)：晚間基本面與缺漏標的滾動補齊（先核心/熱門再往下補）
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      market_scope:
        description: "抓取範圍：priority（重點股清單 priority_stocks.json）或 full_market（全市場 stock_list_common.json）"
        required: true
        default: "priority"
        type: choice
        options:
          - priority
          - full_market
      run_mode:
        description: "執行模式：single_batch（單批/排程同款）或 full_auto_all（手動全自動分批跑完）"
        required: true
        default: "single_batch"
        type: choice
        options:
          - single_batch
          - full_auto_all
      phase:
        description: "更新分段：auto（依台灣時間自動分流）、close_tech（收盤/技術面）、chips（籌碼面）、fundamental（基本面/清單）"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - close_tech
          - chips
          - fundamental
      offset:
        description: "起始筆數 (offset)"
        required: true
        default: "0"
        type: string
      limit:
        description: "單批處理檔數 (limit)；全市場建議設 150~200 以控管每小時 600 次額度"
        required: true
        default: "100"
        type: string
      sleep:
        description: "每檔間隔秒數 (sleep)，建議 0.45~0.6 降低限流風險"
        required: true
        default: "0.5"
        type: string
      only_missing:
        description: "是否僅補抓尚未入庫或缺漏標的 (auto=排程依時段自動決定)"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "false"
          - "true"
      top_amount:
        description: "盤後量額動態擴充：成交金額前 N 名"
        required: true
        default: "60"
        type: string
      top_volume:
        description: "盤後量額動態擴充：成交張數前 N 名"
        required: true
        default: "40"
        type: string
      max_total:
        description: "重點股清單總量上限 (max_total)"
        required: true
        default: "150"
        type: string

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run dashboard update (scheduled, priority, or full_market)
        env:
          PYTHONPATH: scripts
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MARKET_SCOPE: ${{ github.event.inputs.market_scope || 'priority' }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'single_batch' }}
          PHASE_INPUT: ${{ github.event.inputs.phase || 'auto' }}
          START_OFFSET: ${{ github.event.inputs.offset || '0' }}
          BATCH_LIMIT: ${{ github.event.inputs.limit || '100' }}
          SLEEP_SEC: ${{ github.event.inputs.sleep || '0.5' }}
          ONLY_MISSING_INPUT: ${{ github.event.inputs.only_missing || 'auto' }}
          TOP_AMOUNT: ${{ github.event.inputs.top_amount || '60' }}
          TOP_VOLUME: ${{ github.event.inputs.top_volume || '40' }}
          MAX_TOTAL: ${{ github.event.inputs.max_total || '150' }}
          MAX_HOURLY_CALLS: "580"
        run: |
          python - << 'EOF'
          import datetime as dt
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import time

          event_name = os.environ["EVENT_NAME"]
          market_scope = os.environ.get("MARKET_SCOPE", "priority").strip().lower()
          run_mode = os.environ["RUN_MODE"]
          phase_input = os.environ["PHASE_INPUT"]
          start_offset = int(os.environ["START_OFFSET"])
          batch_limit = int(os.environ["BATCH_LIMIT"])
          sleep_sec = float(os.environ["SLEEP_SEC"])
          only_missing_input = os.environ["ONLY_MISSING_INPUT"].lower()
          top_amount = int(os.environ.get("TOP_AMOUNT", "60"))
          top_volume = int(os.environ.get("TOP_VOLUME", "40"))
          max_total = int(os.environ.get("MAX_TOTAL", "150"))
          max_hourly_calls = int(os.environ.get("MAX_HOURLY_CALLS", "580"))

          tz_cst = dt.timezone(dt.timedelta(hours=8))
          cst_now = dt.datetime.now(tz_cst)
          is_evening_backfill = cst_now.hour >= 20

          if phase_input != "auto":
              phase = phase_input
          elif is_evening_backfill:
              phase = "fundamental"
          elif cst_now.hour >= 16:
              phase = "chips"
          else:
              phase = "close_tech"

          if only_missing_input == "true":
              only_missing = True
          elif only_missing_input == "false":
              only_missing = False
          else:
              # 晚間 20:00/21:00 補齊時段預設開啟 --only-missing，日間盤後主更新預設關閉
              only_missing = True if (event_name == "schedule" and is_evening_backfill) else False

          use_full_market = (event_name == "workflow_dispatch" and market_scope == "full_market")
          priority_file = "data/priority_stocks.json"

          def update_market_overview():
              if not os.path.exists("scripts/update_market.py"):
                  print("[略過] 找不到 scripts/update_market.py")
                  return
              print("=== 更新大盤與市場概況: python -u scripts/update_market.py ===")
              res = subprocess.run(["python", "-u", "scripts/update_market.py"], check=False)
              if res.returncode != 0:
                  print(f"[警告] update_market.py 回傳碼={res.returncode}，沿用既有大盤資料繼續執行個股批次")

          def refresh_priority_stocks():
              if not os.path.exists("scripts/build_priority_stocks.py"):
                  print("[略過] 找不到 scripts/build_priority_stocks.py，沿用既有 priority_stocks.json")
                  return
              cmd = [
                  "python", "-u", "scripts/build_priority_stocks.py",
                  "--top-amount", str(top_amount),
                  "--top-volume", str(top_volume),
                  "--max-total", str(max_total),
              ]
              print(f"=== 更新盤後重點股清單: {' '.join(cmd)} ===")
              subprocess.run(cmd, check=True)

          # 先更新大盤概況，再處理清單與個股
          update_market_overview()

          if not use_full_market:
              if phase == "close_tech" or event_name == "workflow_dispatch" or not os.path.exists(priority_file):
                  refresh_priority_stocks()

          total_symbols = None
          if use_full_market:
              list_candidates = ["data/stock_list_common.json", "scripts/data/stock_list_common.json"]
          else:
              list_candidates = [priority_file, "data/stock_list_common.json", "scripts/data/stock_list_common.json"]

          for candidate in list_candidates:
              if os.path.exists(candidate):
                  with open(candidate, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      if isinstance(data, list):
                          total_symbols = len(data)
                      elif isinstance(data, dict) and "items" in data:
                          total_symbols = len(data["items"])
                      elif isinstance(data, dict) and "stocks" in data:
                          total_symbols = len(data["stocks"])
                  print(f"[清單來源] scope={market_scope} | 檔案={candidate} | 總檔數={total_symbols}")
                  break

          def run_health_check():
              if os.path.exists("check_data_health.py"):
                  print("=== 執行 JSON 語法與數值健康檢查 ===")
                  subprocess.run(["python", "-u", "check_data_health.py"], check=True)

          def push_data_safely(msg: str):
              subprocess.run(["git", "add", "data/"], check=True)
              status = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True, check=True)
              if not status.stdout.strip():
                  print("本批無資料檔案變更，略過 commit。")
                  return

              subprocess.run(["git", "commit", "-m", msg], check=True)
              for attempt in range(3):
                  subprocess.run(["git", "fetch", "origin", "main"], check=True)
                  res = subprocess.run(["git", "pull", "--rebase", "origin", "main"], capture_output=True, text=True)
                  if res.returncode == 0:
                      push_res = subprocess.run(["git", "push", "origin", "main"], capture_output=True, text=True)
                      if push_res.returncode == 0:
                          print(f"已推送批次提交: {msg}")
                          return
                  subprocess.run(["git", "rebase", "--abort"], capture_output=True, text=True)
                  backup_dir = tempfile.mkdtemp(prefix="data_backup_")
                  try:
                      if os.path.exists("data"):
                          shutil.copytree("data", os.path.join(backup_dir, "data"), dirs_exist_ok=True)
                      subprocess.run(["git", "reset", "--hard", "origin/main"], check=True)
                      if os.path.exists("data"):
                          shutil.rmtree("data")
                      if os.path.exists(os.path.join(backup_dir, "data")):
                          shutil.copytree(os.path.join(backup_dir, "data"), "data")
                  finally:
                      shutil.rmtree(backup_dir, ignore_errors=True)

                  subprocess.run(["git", "add", "data/"], check=True)
                  st2 = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True, check=True)
                  if st2.stdout.strip():
                      subprocess.run(["git", "commit", "-m", msg], check=True)
                      p2 = subprocess.run(["git", "push", "origin", "main"], capture_output=True, text=True)
                      if p2.returncode == 0:
                          print(f"已於衝突恢復後推送批次提交: {msg}")
                          return
                  time.sleep(2)
              raise RuntimeError(f"推送資料失敗: {msg}")

          def run_one_batch(cur_offset: int, cur_limit: int, cur_sleep: float, desc_tag: str, force_check: bool = False):
              cmd = [
                  "python", "-u", "scripts/run_dashboard_batch.py",
                  "--phase", phase,
                  "--offset", str(cur_offset),
                  "--limit", str(cur_limit),
                  "--sleep", str(cur_sleep),
                  "--max-hourly-calls", str(max_hourly_calls),
              ]
              if use_full_market:
                  cmd.append("--full-market")
              elif os.path.exists(priority_file):
                  cmd.extend(["--priority-file", priority_file])

              if only_missing:
                  cmd.append("--only-missing")
              if force_check:
                  cmd.append("--force-check")

              scope_tag = "full" if use_full_market else "priority"
              print(f"=== 執行批次 ({desc_tag} | scope={scope_tag} | phase={phase} | only_missing={only_missing}): {' '.join(cmd)} ===")
              subprocess.run(cmd, check=True)
              run_health_check()
              msg = f"chore(data): update stock dashboard [{scope_tag}/{phase}] ({desc_tag} --offset {cur_offset} --limit {cur_limit})"
              push_data_safely(msg)

          if event_name != "workflow_dispatch" or run_mode == "single_batch":
              run_one_batch(start_offset, batch_limit, sleep_sec, event_name, force_check=False)
          else:
              step_size = batch_limit if batch_limit > 0 else 150
              cur = start_offset
              batch_idx = 1
              pause_sec = 20 if use_full_market else 8

              while True:
                  if total_symbols is not None and cur >= total_symbols:
                      print(f"已達清單結尾 (scope={market_scope}, total={total_symbols})，full_auto_all 完成。")
                      break

                  run_one_batch(cur, step_size, sleep_sec, f"full_auto_all #{batch_idx}", force_check=False)
                  cur += step_size
                  batch_idx += 1

                  if total_symbols is None and batch_idx > 25:
                      print("已達安全上限 25 批，結束迴圈。")
                      break

                  time.sleep(pause_sec)
          EOF