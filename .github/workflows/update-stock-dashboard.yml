name: Update TW Stock Dashboard Data

on:
  schedule:
    # 週一至週五盤後分批執行（時間為 UTC，對應台灣時間 15:00 ~ 18:30）
    - cron: "0 7 * * 1-5"    # 15:00 CST -> offset 0
    - cron: "25 7 * * 1-5"   # 15:25 CST -> offset 250
    - cron: "50 7 * * 1-5"   # 15:50 CST -> offset 500
    - cron: "15 8 * * 1-5"   # 16:15 CST -> offset 750
    - cron: "40 8 * * 1-5"   # 16:40 CST -> offset 1000
    - cron: "5 9 * * 1-5"    # 17:05 CST -> offset 1250
    - cron: "30 9 * * 1-5"   # 17:30 CST -> offset 1500
    - cron: "55 9 * * 1-5"   # 17:55 CST -> offset 1750
    - cron: "30 10 * * 1-5"  # 18:30 CST -> --only-missing 補抓

  workflow_dispatch:
    inputs:
      offset:
        description: "起始筆數 (offset)"
        required: true
        default: "0"
      limit:
        description: "單批處理檔數 (limit)"
        required: true
        default: "250"
      only_missing:
        description: "是否僅補抓尚未入庫標的 (true/false)"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: stock-data-update
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository (淺層複製省空間)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine batch arguments
        id: batch_args
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.only_missing }}" = "true" ]; then
              echo "ARGS=--only-missing --limit ${{ github.event.inputs.limit }} --sleep 0.35" >> $GITHUB_OUTPUT
            else
              echo "ARGS=--offset ${{ github.event.inputs.offset }} --limit ${{ github.event.inputs.limit }} --sleep 0.25" >> $GITHUB_OUTPUT
            fi
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * 1-5")   echo "ARGS=--offset 0 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "25 7 * * 1-5")  echo "ARGS=--offset 250 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "50 7 * * 1-5")  echo "ARGS=--offset 500 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "15 8 * * 1-5")  echo "ARGS=--offset 750 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "40 8 * * 1-5")  echo "ARGS=--offset 1000 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "5 9 * * 1-5")   echo "ARGS=--offset 1250 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "30 9 * * 1-5")  echo "ARGS=--offset 1500 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "55 9 * * 1-5")  echo "ARGS=--offset 1750 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
              "30 10 * * 1-5") echo "ARGS=--only-missing --limit 200 --sleep 0.40" >> $GITHUB_OUTPUT ;;
              *)               echo "ARGS=--offset 0 --limit 250 --sleep 0.25" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run dashboard batch update
        env:
          PYTHONPATH: scripts
        run: |
          python -u scripts/run_dashboard_batch.py ${{ steps.batch_args.outputs.ARGS }}

      - name: Commit and push updated JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update stock dashboard (${{ steps.batch_args.outputs.ARGS }})"
          # 若期間有其他推送先拉取再推，避免衝突
          git pull --rebase origin main || true
          git push origin HEAD:main